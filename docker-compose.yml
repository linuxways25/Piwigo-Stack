
# DEFINED PIWIGO NETWORK #
networks:
  piwigo-network:
    driver: bridge
    name: piwigo-network

services:
  # NGINX CONTAINER USED AS REVERSE PROXY #
  nginx:
    image: nginx:stable-alpine
    container_name: piwigo-nginx
    ports:
      - "90:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - piwigo
    networks:
      - piwigo-network

# PIWIGO APP CONTAINER #
  piwigo:
    image: lscr.io/linuxserver/piwigo:16.4.0
    container_name: piwigo
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /home/atif/piwigo/config/:/config
      - /home/atif/piwigo/gallery:/gallery
    expose:
      - "80"

    restart: unless-stopped

    networks:
      - piwigo-network

# DATABASE CONTAINER #
  mariadb:
    image: lscr.io/linuxserver/mariadb:11.4.8
    container_name: mariadb
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - MYSQL_ROOT_PASSWORD=Define-Password
      - MYSQL_DATABASE=Define-Database-name
      - MYSQL_USER=Define-Username
      - MYSQL_PASSWORD=Define-Password

    volumes:
      - /home/atif/piwigo/mariadb-config:/config
    ports:
      - 3306:3306
    restart: unless-stopped

    networks:
      - piwigo-network

# REDIS CONTAINER USE AS CACHE LAYER #
  redis:
    image: redis:7-alpine
    container_name: redis

    mem_limit: 512m

    command: >
      redis-server
      --appendonly yes
      --requirepass Define-Password
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

    volumes:
      - ./redis-data:/data

    restart: unless-stopped

    networks:
      - piwigo-network

